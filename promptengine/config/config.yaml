# ── Few-Shot Examples ─────────────────────────────────────────────────────────
# Esempi per migliorare la qualità delle risposte LLM.
# Il router inietterà 1-2 esempi nel prompt quando disponibili.

few_shot_examples:
  email:
    - input: "scrivi una mail al professore per chiedere un appuntamento"
      output: |
        Oggetto: Richiesta di colloquio - Corso di Ingegneria del Software
        
        Gentile Prof. Rossi,
        
        Le scrivo per richiedere un appuntamento durante il Suo orario di ricevimento.
        Avrei necessità di discutere alcuni aspetti del progetto finale del corso.
        
        Sarebbe disponibile nella settimana del 15-19 luglio?
        
        La ringrazio anticipatamente per la disponibilità.
        
        Cordiali saluti,
        [Nome Cognome]
  code:
    - input: "scrivi una funzione python per ordinare una lista"
      output: |
        def merge_sort(arr: list) -> list:
            """Implementazione del Merge Sort con complessità O(n log n)."""
            if len(arr) <= 1:
                return arr
            mid = len(arr) // 2
            left = merge_sort(arr[:mid])
            right = merge_sort(arr[mid:])
            return _merge(left, right)
        
        def _merge(left: list, right: list) -> list:
            result = []
            i = j = 0
            while i < len(left) and j < len(right):
                if left[i] <= right[j]:
                    result.append(left[i])
                    i += 1
                else:
                    result.append(right[j])
                    j += 1
            result.extend(left[i:])
            result.extend(right[j:])
            return result
  summary:
    - input: "riassumi il concetto di machine learning"
      output: |
        Il Machine Learning è una branca dell'intelligenza artificiale che permette
        ai sistemi informatici di apprendere automaticamente dai dati senza essere
        esplicitamente programmati. Si divide in tre paradigmi principali:
        
        1. **Supervised Learning**: apprendimento da dati etichettati
        2. **Unsupervised Learning**: scoperta di pattern in dati non etichettati
        3. **Reinforcement Learning**: apprendimento tramite ricompense/penalità

