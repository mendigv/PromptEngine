topic_contexts:
  email: "L'utente deve redigere una comunicazione scritta professionale. La richiesta è {complexity}. Contesto specifico: \"{trimmed}\". Il destinatario e il tono devono essere inferiti dal contesto."
  code: "L'utente ha un task di sviluppo software da risolvere. La richiesta è {complexity}. Specifiche tecniche: \"{trimmed}\". Priorità: correttezza, leggibilità, manutenibilità."
  content: "L'utente necessita di contenuto scritto originale. La richiesta è {complexity}. Brief creativo: \"{trimmed}\". L'output deve essere immediatamente pubblicabile."
  summary: "L'utente vuole una sintesi efficace. La richiesta è {complexity}. Argomento da sintetizzare: \"{trimmed}\". Il risultato deve essere denso di valore e privo di ridondanze."
  strategy: "L'utente affronta una sfida strategica. La richiesta è {complexity}. Scenario: \"{trimmed}\". L'analisi deve essere actionable e basata su framework consolidati."
  translation: "L'utente necessita di una traduzione/adattamento linguistico. La richiesta è {complexity}. Testo: \"{trimmed}\". Priorità: naturalezza nella lingua target e fedeltà semantica."
  explain: "L'utente vuole comprendere qualcosa. La richiesta è {complexity}. Domanda: \"{trimmed}\". La spiegazione deve essere accessibile ma non banalizzante."
  general: "L'utente ha una richiesta specifica che richiede competenza nel merito. La richiesta è {complexity}. Domanda/richiesta: \"{trimmed}\". Determina autonomamente il dominio di competenza (storia, scienza, cucina, ecc.) in base al contenuto."

topic_tasks:
  email: |
    Redigi una email completa e professionale basata sul contesto fornito.
    
    Passo 1 — Analisi: Identifica destinatario, scopo primario e tono appropriato.
    Passo 2 — Oggetto: Formula un oggetto chiaro (max 60 caratteri), specifico e orientato all'azione.
    Passo 3 — Apertura: Saluto calibrato al destinatario + frase di apertura contestualizzante.
    Passo 4 — Corpo: Sviluppa la richiesta in 2-3 paragrafi logicamente connessi.
    Passo 5 — Chiusura: Formula di congedo professionale + call-to-action esplicita se necessaria.
    Passo 6 — Firma: Struttura firma appropriata al contesto.
  code: |
    Sviluppa una soluzione software completa per il task specificato.
    
    Passo 1 — Analisi del problema: Scomponi il task in sotto-problemi. Identifica edge cases e vincoli.
    Passo 2 — Design dell'architettura: Scegli pattern e strutture dati ottimali. Motiva le scelte.
    Passo 3 — Implementazione: Scrivi il codice completo, funzionante e commentato.
    Passo 4 — Gestione errori: Implementa error handling robusto per tutti i casi limite.
    Passo 5 — Testing: Fornisci almeno 3 casi di test significativi.
    Passo 6 — Documentazione: Aggiungi docstring e un esempio d'uso pratico.
  content: |
    Crea contenuto originale e ad alto impatto per il brief specificato.
    
    Passo 1 — Hook: Formula un'apertura che cattura l'attenzione nei primi 3 secondi.
    Passo 2 — Promessa: Esplicita chiaramente il valore che il lettore otterrà.
    Passo 3 — Sviluppo: Costruisci con struttura Problem-Agitate-Solve.
    Passo 4 — Prove: Inserisci dati, esempi concreti o casi d'uso.
    Passo 5 — CTA: Chiusura con call-to-action singola, chiara e motivata.
  summary: |
    Produci una sintesi cognitivamente efficace del materiale specificato.
    
    Passo 1 — Panoramica (max 3 righe): Qual è l'idea centrale? Perché è rilevante?
    Passo 2 — Struttura: Identifica i 3-5 punti chiave in ordine gerarchico di importanza.
    Passo 3 — Insight: Estrai le conclusioni non ovvie o controintuitive.
    Passo 4 — Connessioni: Evidenzia relazioni tra i concetti.
    Passo 5 — Takeaway: Una frase finale che sintetizza il valore essenziale.
  strategy: |
    Sviluppa un'analisi strategica strutturata e immediatamente applicabile.
    
    Passo 1 — Diagnosi situazionale: SWOT sintetico, focus sui fattori critici.
    Passo 2 — Obiettivi SMART: Definisci 2-3 obiettivi misurabili con timeline.
    Passo 3 — Iniziative prioritarie: 3-5 azioni ad alto impatto/basso sforzo.
    Passo 4 — Piano operativo: Timeline a 30/60/90 giorni con milestone verificabili.
    Passo 5 — KPI e metriche: Definisci i 3-5 indicatori di successo.
    Passo 6 — Risk management: Identifica i 3 rischi principali e il piano di mitigazione.
  translation: |
    Esegui una traduzione professionale di alta qualità.
    
    Passo 1 — Analisi: Identifica registro, tono, pubblico target e specificità culturali.
    Passo 2 — Prima traduzione: Fedele al significato semantico completo.
    Passo 3 — Adattamento culturale: Rivedi idiomi e strutture non trasferibili direttamente.
    Passo 4 — Ottimizzazione del registro: Assicurati che il tono corrisponda all'originale.
    Passo 5 — Revisione terminologica: Verifica consistenza dei termini tecnici.
  explain: |
    Spiega in modo chiaro, preciso e memorabile.
    
    Passo 1 — Definizione essenziale: Cos'è in una frase. Nessun prerequisito richiesto.
    Passo 2 — Analogia concreta: Collega il concetto a qualcosa di familiare nella vita quotidiana.
    Passo 3 — Meccanismo: Come funziona concretamente, step by step. Esempi reali, non astratti.
    Passo 4 — Perché importa: Applicazioni pratiche e rilevanza nel mondo reale.
    Passo 5 — Malintesi comuni: Chiarifica le 2-3 incomprensioni più frequenti.
    Passo 6 — Approfondimento: Per chi vuole saperne di più, indica la direzione successiva.
  general: |
    Rispondi in modo completo, accurato e ben strutturato alla richiesta: "{user_text}"
    
    Passo 1 — Identificazione del dominio: Determina l'ambito (storia, scienza, cucina, sport, ecc.) e adatta il tuo approccio.
    Passo 2 — Risposta diretta: Affronta subito il cuore della domanda senza premesse superflue.
    Passo 3 — Contestualizzazione: Aggiungi il contesto necessario (date, cause, definizioni).
    Passo 4 — Dettagli rilevanti: Approfondisci gli aspetti più significativi.
    Passo 5 — Sintesi finale: Chiudi con una considerazione che lega il tutto.
    
    Non assumere che la domanda riguardi software o business se non esplicitamente richiesto.

