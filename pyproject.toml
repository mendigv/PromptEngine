[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "promptengine"
version = "2.5.0"
description = "AI Prompt Optimization Engine — Generates model-specific structured prompts for ChatGPT, Claude, Gemini, and 12+ LLMs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PromptEngine Team"}
]
keywords = ["prompt-engineering", "llm", "chatgpt", "claude", "gemini", "ai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pyotp>=2.9",
    "python-dotenv>=1.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "mypy",
    "ruff",
]

[project.scripts]
promptengine = "promptengine.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptengine*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
